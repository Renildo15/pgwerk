name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/ci.yml"
      - "pgwerk/**"
      - "tests/**"
      - "conformance/**"
      - "docs/reference/remote-openapi.json"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "pgwerk/**"
      - "tests/**"
      - "conformance/**"
      - "docs/reference/remote-openapi.json"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Type check
        run: uv run mypy pgwerk/

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile
        working-directory: dashboard

      - name: Build dashboard
        run: pnpm build
        working-directory: dashboard

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Build wheel
        run: uv build --wheel

  test:
    needs: [typecheck, build]
    name: Python ${{ matrix.python-version }} / Postgres ${{ matrix.postgres-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        postgres-version: ["14", "15", "16"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: pgwerk
          POSTGRES_PASSWORD: pgwerk
          POSTGRES_DB: pgwerk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Integration tests
        env:
          PGWERK_TEST_DSN: postgresql://pgwerk:pgwerk@localhost/pgwerk_test
        run: uv run pytest tests/integration/ -v --tb=short

  conformance:
    needs: [typecheck, build]
    name: Remote protocol conformance
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pgwerk
          POSTGRES_PASSWORD: pgwerk
          POSTGRES_DB: pgwerk_conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DSN: postgresql://pgwerk:pgwerk@localhost/pgwerk_conformance
      PGWERK_CONFORMANCE_URL: http://127.0.0.1:8000
      PGWERK_CONFORMANCE_ADMIN_TOKEN: ci-admin-token

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Start a remote-workers server
        run: |
          uv run werk migrate --dsn "$DSN"
          uv run werk api --dsn "$DSN" --remote-workers --api-token "$PGWERK_CONFORMANCE_ADMIN_TOKEN" \
            --no-ui --port 8000 > server.log 2>&1 &
          for i in $(seq 1 100); do
            curl -s -o /dev/null -X POST http://127.0.0.1:8000/remote/v1/claim && break
            sleep 0.2
          done
          token=$(uv run werk token create --dsn "$DSN" --name ci --queues conformance | grep '^pgwk_e_')
          echo "::add-mask::$token"
          echo "PGWERK_CONFORMANCE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Server conformance
        run: uv run pytest conformance/server -v --tb=short

      - name: Client conformance (Python RemoteWorker)
        run: uv run pytest conformance/client -v --tb=short

      - name: Server log
        if: failure()
        run: cat server.log
